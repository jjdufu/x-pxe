# x-pxe 部署（Step 13）：control（管理端 8088、引导端 8080、内部 API 8081 仅回环）+ bootnet（host 网络）。
# 用法：cp .env.example .env && 编辑 → ../scripts/init-secrets.sh → docker compose up -d
# 仅 Redfish 时可只启动 control：docker compose up -d control
name: x-pxe

x-hardening: &hardening
  image: x-pxe:${XPXE_VERSION:?请在 .env 中设置 XPXE_VERSION}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  control:
    <<: *hardening
    command: ["serve"]
    ports:
      - "${XPXE_ADMIN_PUBLISH:-8088}:8088"
      - "${XPXE_BOOT_PUBLISH:-8080}:8080"
      - "127.0.0.1:8081:8081"
    environment:
      XPXE_BOOT_BASE_URL: ${XPXE_BOOT_BASE_URL:?例如 http://192.168.2.3:8080}
      XPXE_OFFLINE: ${XPXE_OFFLINE:-false}
      XPXE_LOG: ${XPXE_LOG:-info}
      XPXE_BOOTNET_ALLOWED_IFACES: ${XPXE_BOOTNET_ALLOWED_IFACES:-}
      XPXE_TLS_CERT_FILE: ${XPXE_TLS_CERT_FILE:-}
      XPXE_TLS_KEY_FILE: ${XPXE_TLS_KEY_FILE:-}
    secrets: [xpxe_master_key, xpxe_admin_initial_password, xpxe_bootnet_token]
    volumes: ["xpxe-data:/data"]
    tmpfs: ["/tmp:size=64m,mode=1777"]

  bootnet:
    <<: *hardening
    entrypoint: ["/usr/local/bin/xpxe-bootnet"]
    command: ["run"]
    network_mode: host
    # Docker（实测 29.x）对非 root 用户不设置 ambient 能力，cap_add 在 setuid 后被清空；
    # 因此 bootnet 以 UID 0 运行，但能力集只有 NET_BIND_SERVICE（CapEff=0x400）、无 DAC_OVERRIDE、只读根、no-new-privileges。
    # 组 10001 用于读取 0440 的 bootnet_token。
    user: "0:10001"
    cap_add: [NET_BIND_SERVICE]          # 内核 < 5.7 时追加 NET_RAW（见 README 3.1）
    environment:
      XPXE_CONTROL_URL: http://127.0.0.1:8081
      XPXE_BOOTNET_ALLOWED_IFACES: ${XPXE_BOOTNET_ALLOWED_IFACES:?例如 ens192}
      XPXE_LOG: ${XPXE_LOG:-info}
    secrets: [xpxe_bootnet_token]
    healthcheck:
      test: ["CMD", "/usr/local/bin/xpxe-bootnet", "healthcheck"]
      interval: 15s
      timeout: 3s
    depends_on:
      control: { condition: service_healthy }

secrets:
  xpxe_master_key:             { file: ./secrets/master_key }
  xpxe_admin_initial_password: { file: ./secrets/admin_initial_password }
  xpxe_bootnet_token:          { file: ./secrets/bootnet_token }

volumes:
  xpxe-data: {}
