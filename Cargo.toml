[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jjdufu/x-pxe"
readme = "README.md"
keywords = ["pxe", "ipxe", "dhcp", "debian", "provisioning"]
categories = ["network-programming", "command-line-utilities"]
publish = false

[workspace.dependencies]
# 内部 crate
xpxe-test-support = { path = "crates/xpxe-test-support" }
xpxe-dhcp = { path = "crates/xpxe-dhcp" }
xpxe-tftp = { path = "crates/xpxe-tftp" }
xpxe-image = { path = "crates/xpxe-image" }
xpxe-domain = { path = "crates/xpxe-domain" }
xpxe-render = { path = "crates/xpxe-render" }
xpxe-assets = { path = "crates/xpxe-assets" }
xpxe-store = { path = "crates/xpxe-store" }
xpxe-redfish = { path = "crates/xpxe-redfish" }
xpxe-control = { path = "crates/xpxe-control" }
xpxe-bootnet = { path = "crates/xpxe-bootnet" }
# 第三方：统一关闭默认特性，按需开启
tokio = { version = "~1.46", default-features = false, features = ["rt-multi-thread", "net", "time", "fs", "io-util", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form", "matched-path", "original-uri"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "limit", "set-header"] }
hyper = { version = "1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = ">=0.1.16, <0.1.17", default-features = false, features = ["tokio", "client-legacy", "http1", "server", "service"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = { version = "1", default-features = false, features = ["std"] }
http-body-util = { version = "0.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
ring = { version = "0.17", default-features = false, features = ["std", "alloc"] }
webpki-roots = { version = "1", default-features = false }
socket2 = { version = "~0.5.10", default-features = false, features = ["all"] }
minijinja = { version = "3", default-features = false, features = ["serde"] }
sha2 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
hex = { version = "0.4", default-features = false, features = ["std"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
lzma-rs = { version = "0.3", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
sha-crypt = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
serde = { version = "~1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
time = { version = "0.3", default-features = false, features = ["std", "serde", "formatting", "parsing"] }

[workspace.lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_results = "deny"
unused_import_braces = "deny"
unused_macro_rules = "deny"
unused_extern_crates = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
meta_variable_misuse = "deny"
macro_use_extern_crate = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
non_ascii_idents = "deny"
ambiguous_negative_literals = "deny"
deprecated_in_future = "deny"
closure_returning_async_block = "deny"
impl_trait_redundant_captures = "deny"
deref_into_dyn_supertrait = "deny"
# 以下与 unsafe_code = "forbid" 重叠，作冗余防线保留
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"

[workspace.lints.rustdoc]
# all 已包含下面三项，显式列出便于审阅
all = { level = "deny", priority = -1 }
missing_crate_level_docs = "deny"
unescaped_backticks = "deny"
private_doc_tests = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# nursery 组不整组开启：组内 redundant_pub_crate 与 rustc unreachable_pub 冲突。
# 下面逐项列出 clippy 1.100.0 nursery 组除 redundant_pub_crate 外的全部 51 项
as_ptr_cast_mut = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
coerce_container_to_any = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
doc_link_code = "deny"
empty_enums = "deny"
equatable_if_let = "deny"
fallible_impl_from = "deny"
future_not_send = "deny"
imprecise_flops = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
large_stack_frames = "deny"
literal_string_with_formatting_args = "deny"
missing_const_for_fn = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
needless_type_cast = "deny"
non_send_fields_in_send_ty = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
search_is_some = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
single_option_map = "deny"
string_lit_as_bytes = "deny"
suboptimal_flops = "deny"
suspicious_operation_groupings = "deny"
too_long_first_doc_paragraph = "deny"
trailing_empty_array = "deny"
trait_duplication_in_bounds = "deny"
transmute_undefined_repr = "deny"
trivial_regex = "deny"
tuple_array_conversions = "deny"
type_repetition_in_bounds = "deny"
uninhabited_references = "deny"
unnecessary_struct_initialization = "deny"
unused_peekable = "deny"
unused_rounding = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
volatile_composites = "deny"
while_float = "deny"
# restriction 组只能逐项开启（组内有互相矛盾的项），下面是全部可兼容项
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
as_conversions = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"
default_numeric_fallback = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
try_err = "deny"
wildcard_enum_match_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
ref_patterns = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
missing_assert_message = "deny"
error_impl_error = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_docs_in_private_items = "deny"
doc_include_without_cfg = "deny"
tests_outside_test_module = "deny"
redundant_test_prefix = "deny"
cfg_not_test = "deny"
infinite_loop = "deny"
if_then_some_else_none = "deny"
else_if_without_else = "deny"
impl_trait_in_params = "deny"
mixed_read_write_in_expression = "deny"
multiple_inherent_impl = "deny"
same_name_method = "deny"
renamed_function_params = "deny"
partial_pub_fields = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
empty_enum_variants_with_brackets = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
format_push_string = "deny"
needless_raw_strings = "deny"
deref_by_slicing = "deny"
iter_over_hash_type = "deny"
suspicious_xor_used_as_pow = "deny"
precedence_bits = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
unnecessary_self_imports = "deny"
unused_trait_names = "deny"
redundant_type_annotations = "deny"
non_zero_suggestions = "deny"
pathbuf_init_then_push = "deny"
return_and_then = "deny"
map_with_unused_argument_over_ranges = "deny"
min_ident_chars = "deny"
module_name_repetitions = "deny"
mod_module_files = "deny"
pub_without_shorthand = "deny"
semicolon_inside_block = "deny"
unseparated_literal_suffix = "deny"
# 以下与 unsafe_code 重叠，作冗余防线保留
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

# argon2id（m = 64 MiB，t = 3）在未优化构建下单次哈希需数秒；只对它及其哈希核心开优化，
# 测试仍使用生产参数，不另设弱参数路径。
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
