# 最小可装机 preseed（实验室手写基准，Step 4 渲染结果的对照）。
# 镜像源经实验室 APT 缓存（10.77.0.1:3142）回源；虚拟机本身没有外网出口。
#
# early_command 用 busybox wget 的 --post-data/--header 上报事件（验证 H8），
# lab/run.sh 以“取到 preseed + 收到 early 事件”判定进入 d-i。
d-i preseed/early_command string \
  mac="$(cat /sys/class/net/$(ip route | awk '/default/{print $5; exit}')/address 2>/dev/null)"; \
  wget -q -O /dev/null --header "Content-Type: text/plain" --header "X-Lab-Event: early" \
    --post-data "event=early mac=${mac} netcfg_iface=$(debconf-get netcfg/choose_interface 2>/dev/null)" \
    http://10.77.0.1:8080/events/early || true

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string lab-node
d-i netcfg/get_domain string lab
d-i netcfg/hostname string lab-node
d-i hw-detect/load_firmware boolean false

d-i mirror/country string manual
d-i mirror/http/hostname string 10.77.0.1:3142
d-i mirror/http/directory string /deb.debian.org/debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

d-i passwd/root-login boolean false
d-i passwd/user-fullname string Lab
d-i passwd/username string lab
# “!”为锁定口令：实验室节点不允许口令登录
d-i passwd/user-password-crypted password !
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean false

d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/services-select multiselect
tasksel tasksel/first multiselect standard, ssh-server
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note
