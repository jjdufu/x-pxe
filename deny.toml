# cargo deny check 配置（Step 13 R 场景）：许可证白名单、依赖来源与重复版本、安全公告。
[graph]
all-features = true

[advisories]
# RustSec 公告库中的漏洞与撤回版本一律视为违规（默认行为）。忽略项必须写明理由并登记在 step-13 第 8 节偏差表。
ignore = [
  # tokio AsyncFd 安全构造器不要求 fd 所有权（unsound）。本仓库不使用 tokio::io::unix::AsyncFd，
  # 且 tokio 锁定在 ~1.46（修复版本 1.51.6+ 需要整体升级依赖），留待依赖升级时移除
  { id = "RUSTSEC-2026-0386", reason = "未使用 AsyncFd；tokio 升级前暂时忽略" },
]

[licenses]
# 只允许宽松许可证；新增依赖引入其他许可证时需要先评估再加入
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-3-Clause",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
